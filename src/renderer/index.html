<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex LED Widget</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-state="loading" data-risk="safe">
    <main id="widget" class="widget">
      <div class="scanline" aria-hidden="true"></div>
      <div class="glow glow-cyan" aria-hidden="true"></div>
      <div class="glow glow-red" aria-hidden="true"></div>

      <header class="titlebar">
        <div class="brand">
          <span id="trafficLight" class="traffic-light loading" aria-hidden="true"></span>
          <div class="brand-copy">
            <span id="brandName" class="brand-name">Codex 额度监控</span>
            <span id="stateText" class="brand-state">正在读取本机额度</span>
          </div>
        </div>

        <div class="window-actions">
          <span id="healthPill" class="health-pill">同步中</span>
          <button id="langBtn" class="text-button" title="Language" aria-label="Language">EN</button>
          <button id="pinBtn" class="icon-button active" title="取消置顶" aria-label="取消置顶">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 4l6 6-3 1-4 4v4l-2 2-2-6-6-2 2-2h4l4-4 1-3z" />
            </svg>
          </button>
          <button id="fullscreenBtn" class="icon-button" title="全屏" aria-label="全屏" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5" />
            </svg>
          </button>
          <button id="refreshBtn" class="icon-button" title="刷新" aria-label="刷新">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 12a8 8 0 0 1-13.7 5.7M4 12A8 8 0 0 1 17.7 6.3M17 3v4h-4M7 21v-4h4" />
            </svg>
          </button>
          <button id="minimizeBtn" class="icon-button" title="隐藏" aria-label="隐藏">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14" />
            </svg>
          </button>
          <button id="closeBtn" class="icon-button danger" title="退出" aria-label="退出">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
      </header>

      <section class="dashboard">
        <section class="hero-panel" aria-label="总体额度">
          <div id="liquidMeter" class="liquid-meter" aria-label="Codex 剩余额度">
            <div class="meter-grid" aria-hidden="true"></div>
            <div id="liquidFill" class="liquid-fill">
              <div class="wave wave-one"></div>
              <div class="wave wave-two"></div>
            </div>
            <div class="glass-rim"></div>
            <div class="shine"></div>
            <div class="meter-copy">
              <strong id="remaining">--%</strong>
              <span id="remainingLabel">剩余额度</span>
            </div>
          </div>

          <div class="hero-meta">
            <div>
              <span id="currentUpdateLabel" class="meta-label">本次更新</span>
              <strong id="currentUpdateText" class="meta-value">--</strong>
            </div>
            <div>
              <span id="nextResetLabel" class="meta-label">下次重置</span>
              <strong id="nextResetText" class="meta-value">--</strong>
            </div>
            <div>
              <span id="planLabel" class="meta-label">计划</span>
              <strong id="planText" class="meta-value">--</strong>
            </div>
          </div>
        </section>

        <section class="info-panel" aria-label="额度详情">
          <div class="quota-card primary">
            <div class="card-head">
              <span id="secondaryLabel">7天窗口</span>
              <strong id="secondaryRemaining">--</strong>
            </div>
            <div class="progress-track">
              <span id="secondaryBar" class="progress-bar"></span>
            </div>
            <div class="card-grid">
              <div>
                <span id="secondaryUsedLabel">已用</span>
                <strong id="secondaryUsed">--</strong>
              </div>
              <div>
                <span id="secondaryResetLabel">重置时间</span>
                <strong id="secondaryReset">--</strong>
              </div>
            </div>
          </div>

          <div id="dailyRiskCard" class="pace-card">
            <div class="pace-head">
              <div>
                <span id="paceLabel">7天额度节奏</span>
                <strong id="dailyStatus">等待数据</strong>
              </div>
              <div class="reset-countdown">
                <span id="secondaryCountdownLabel">重置倒计时</span>
                <strong id="secondaryCountdown">--</strong>
              </div>
            </div>
            <div class="pace-rows">
              <div class="pace-row">
                <div class="pace-row-meta">
                  <span id="quotaUsedPaceLabel">额度已用</span>
                  <strong id="quotaUsedPace">--</strong>
                </div>
                <div class="pace-track">
                  <span id="quotaUsedPaceBar" class="pace-bar quota"></span>
                </div>
              </div>
              <div class="pace-row">
                <div class="pace-row-meta">
                  <span id="timePassedPaceLabel">时间已过</span>
                  <strong id="timePassedPace">--</strong>
                </div>
                <div class="pace-track">
                  <span id="timePassedPaceBar" class="pace-bar time"></span>
                </div>
              </div>
              <div class="pace-row">
                <div class="pace-row-meta">
                  <span id="paceLimitLabel">安全上限</span>
                  <strong id="paceLimit">--</strong>
                </div>
                <div class="pace-track">
                  <span id="paceLimitBar" class="pace-bar limit"></span>
                </div>
              </div>
            </div>
            <p id="dailyHint">超过安全上限会提示放慢节奏</p>
          </div>
        </section>
      </section>

      <footer class="status">
        <span id="statusDot" class="status-dot loading"></span>
        <span id="statusText">正在读取 Codex 额度...</span>
        <span id="nextRefreshText" class="next-refresh">下次刷新 --</span>
      </footer>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
